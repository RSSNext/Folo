packages:
  - apps/*
  - packages/**/*
  - apps/desktop/layer/*
  - "!apps/mobile/native/example"
  - apps/mobile/web-app
  - apps/mobile/web-app/html-renderer
  - store-assets
  - "!**/example"
  - "!**/example/**"

nodeLinker: hoisted
shamefullyHoist: true
saveExact: true

catalog:
  "@follow-app/client-sdk": 0.3.96
  "@folo-services/ai-tools": 0.2.69
  tailwindcss-uikit-colors: 1.0.0
  typescript: 6.0.3

allowBuilds:
  "@parcel/watcher": false
  "@swc/core": false
  better-sqlite3: false
  node-pty: false
  workerd: true
  "@firebase/util": true
  "@tsslint/core": true
  "@tsslint/compat-eslint": true
  bufferutil: true
  core-js: true
  dtrace-provider: true
  electron: true
  electron-winstaller: true
  esbuild: true
  fast-folder-size: true
  fs-xattr: true
  macos-alias: true
  protobufjs: true
  sharp: true
  simple-git-hooks: true
  utf-8-validate: true

overrides:
  "@electron/node-gyp": 10.2.0-electron.2
  "@floating-ui/core": 1.8.0
  "@floating-ui/dom": 1.8.0
  "@floating-ui/react": 0.27.20
  "@floating-ui/react-dom": 2.1.9
  "@follow-app/client-sdk": 0.3.96
  "@folo-services/drizzle": 0.1.48
  "@react-native-menu/menu": 2.0.0
  "@types/react": 19.2.18
  array-includes: npm:@nolyfill/array-includes@latest
  array.prototype.findlastindex: npm:@nolyfill/array.prototype.findlastindex@latest
  array.prototype.flat: npm:@nolyfill/array.prototype.flat@latest
  array.prototype.flatmap: npm:@nolyfill/array.prototype.flatmap@latest
  array.prototype.tosorted: npm:@nolyfill/array.prototype.tosorted@latest
  drizzle-orm: 0.45.3
  eslint-plugin-react-hooks>zod-validation-error: 4.0.2
  global-agent>serialize-error: 7.0.1
  has: npm:@nolyfill/has@latest
  is-core-module: npm:@nolyfill/is-core-module@1.0.39
  isarray: npm:@nolyfill/isarray@1.0.44
  lan-network@<0.1.7: 0.1.7
  nativewind>react-native-css-interop: 0.2.7
  object.assign: npm:@nolyfill/object.assign@latest
  object.entries: npm:@nolyfill/object.entries@latest
  object.fromentries: npm:@nolyfill/object.fromentries@latest
  object.groupby: npm:@nolyfill/object.groupby@latest
  object.hasown: npm:@nolyfill/object.hasown@latest
  object.values: npm:@nolyfill/object.values@latest
  react: 19.2.8
  react-dom: 19.2.8
  react-native-ios-context-menu: 3.2.1
  react-native-ios-utilities: 5.2.0
  react-server-dom-webpack: 19.2.8
  string.prototype.matchall: npm:@nolyfill/string.prototype.matchall@latest
  unrun: 0.3.1

packageExtensions:
  "@hono/zod-openapi@1.2.1":
    peerDependenciesMeta:
      hono:
        optional: true
  "@hono/zod-validator@0.7.6":
    peerDependenciesMeta:
      hono:
        optional: true

patchedDependencies:
  "@mozilla/readability@0.6.0": patches/@mozilla__readability@0.6.0.patch
  "@pengx17/electron-forge-maker-appimage": patches/@pengx17__electron-forge-maker-appimage.patch
  re-resizable@6.11.2: patches/re-resizable@6.11.2.patch
  react-native-ios-utilities@5.2.0: patches/react-native-ios-utilities@5.2.0.patch
  react-native-sheet-transitions: patches/react-native-sheet-transitions.patch
  workbox-precaching: patches/workbox-precaching.patch

peerDependencyRules:
  allowedVersions:
    "@eslint-react/ast>typescript": ">=4.8.4 <6.1.0"
    "@eslint-react/core>typescript": ">=4.8.4 <6.1.0"
    "@eslint-react/eslint-plugin>typescript": ">=4.8.4 <6.1.0"
    "@eslint-react/shared>typescript": ">=4.8.4 <6.1.0"
    "@eslint-react/var>typescript": ">=4.8.4 <6.1.0"
    "@typescript-eslint/project-service>typescript": ">=4.8.4 <6.1.0"
    "@typescript-eslint/tsconfig-utils>typescript": ">=4.8.4 <6.1.0"
